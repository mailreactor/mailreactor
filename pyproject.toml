[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailreactor"
version = "0.1.0"
description = "Headless email client with REST API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hans Stockhausen", email = "hc@vst.io"},
]
dependencies = [
    # Core dependencies
    # NOTE: FastAPI/uvicorn will become optional ([rest] extra) in Story 3-31
    # when webhook-only mode is implemented. For now, they remain core.
    "imapclient>=3.0.0",   # BSD-3 licensed IMAP client (sync, wrapped with executor)
    "aiosmtplib>=3.0.0",   # MIT licensed async SMTP client
    "fastapi>=0.122.0",    # Modern async web framework (will be [rest] extra in Story 3-31)
    "uvicorn[standard]>=0.32.0",   # ASGI server (will be [rest] extra in Story 3-31)
    "pydantic>=2.0.0",     # Data validation
    "pydantic-settings",   # Environment-based configuration
    "email-validator",     # Pydantic EmailStr validation
    "pyyaml>=6.0.0",       # YAML parsing for providers.yaml and mailreactor.yaml
    "cryptography>=41.0.0", # Fernet encryption + PBKDF2 for password encryption
    "typer>=0.20.0",       # CLI framework
    "structlog",           # Structured logging
    "rich",                # Rich console output for logging
    "httpx>=0.27.0",       # Async HTTP client (webhooks + Mozilla Autoconfig)
]

[project.optional-dependencies]

# REST API plugin (FastAPI server)
rest = [
    "fastapi>=0.122.0",        # Modern async web framework
    "uvicorn[standard]>=0.32.0", # ASGI server
]

# MCP plugin (Model Context Protocol)
mcp = [
    "mcp>=1.25.0",  # Model Context Protocol SDK
]

# Full installation (all plugins)
all = [
    "mailreactor[rest,mcp]",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-asyncio",    # Sprint 0 Task #4: Async test support
    "pytest-cov",        # Sprint 0 Task #2: Coverage enforcement
    "pytest-benchmark",  # Sprint 0 Task #6: Performance benchmarks
    "httpx",             # Sprint 0 Task #4: FastAPI TestClient
    "psutil",            # Sprint 0 Task #6: Memory profiling
    "ruff",
    "pre-commit",        # Sprint 0 Task #2.3: Pre-commit hooks
    "detect-secrets",    # Sprint 0 Task #2.3: Secret detection in hooks
    "mypy",
    "types-PyYAML",
]



[project.scripts]
mailreactor = "mailreactor.__main__:main"  # CLI entry point via __main__.py

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/mailreactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

