# Provider Auto-Detection Configuration
# Mail Reactor - IMAP/SMTP settings for major email providers
#
# Schema:
#   <provider_key>:
#     domains: [list of domain variations]
#     imap:
#       host: <imap.server.com>
#       port: <993 typical for SSL>
#       ssl: <true for SSL, false for STARTTLS>
#     smtp:
#       host: <smtp.server.com>
#       port: <587 typical for STARTTLS>
#       starttls: <true for STARTTLS, false for SSL>
#
# Detection Strategy:
# 1. Extract domain from email address (everything after @)
# 2. Lookup domain in provider configs (exact match or alias)
# 3. Return ProviderConfig if found, None if unknown
#
# Update History:
# - 2025-12-05: Initial configuration (Gmail, Outlook, Yahoo, iCloud)

gmail:
  domains:
    - gmail.com
    - googlemail.com  # International Gmail variant
  imap:
    host: imap.gmail.com
    port: 993
    ssl: true
  smtp:
    host: smtp.gmail.com
    port: 465  # Gmail uses implicit SSL (not STARTTLS on 587)
    starttls: false  # Port 465 uses implicit SSL from connection start

outlook:
  domains:
    - outlook.com
    - hotmail.com    # Legacy Microsoft email
    - live.com       # Microsoft Live accounts
    - msn.com        # MSN email service
  imap:
    host: outlook.office365.com
    port: 993
    ssl: true
  smtp:
    host: smtp.office365.com
    port: 587
    starttls: true

yahoo:
  domains:
    - yahoo.com
    - yahoo.co.uk    # Yahoo UK
    - ymail.com      # Yahoo Mail alternate domain
  imap:
    host: imap.mail.yahoo.com
    port: 993
    ssl: true
  smtp:
    host: smtp.mail.yahoo.com
    port: 587
    starttls: true

icloud:
  domains:
    - icloud.com
    - me.com         # Legacy MobileMe domain
    - mac.com        # Legacy .Mac domain
  imap:
    host: imap.mail.me.com
    port: 993
    ssl: true
  smtp:
    host: smtp.mail.me.com
    port: 587
    starttls: true
